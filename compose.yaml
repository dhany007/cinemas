services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinemas
      POSTGRES_USER: cinemas
      POSTGRES_PASSWORD: cinemas
    ports:
      - "127.0.0.1:${CINEMAS_POSTGRES_PORT:-54329}:5432"
    volumes:
      - cinemas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemas -d cinemas"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cinemas:cinemas@postgres:5432/cinemas?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      DATABASE_URL: postgresql://cinemas:cinemas@postgres:5432/cinemas?sslmode=disable
      AUTH_JWT_SECRET: local-development-jwt-secret-change-me
      AUTH_ACCESS_TOKEN_TTL: 1h
      AUTH_ADMIN_BOOTSTRAP_TOKEN: ${AUTH_ADMIN_BOOTSTRAP_TOKEN:-local-admin-bootstrap-token}
      APP_ENV: development
      PAYMENT_PROVIDER: FAKE
      PAYMENT_WEBHOOK_SECRET: local-payment-webhook-secret-change-me
      PAYMENT_WEBHOOK_REPLAY_WINDOW: 5m
    ports:
      - "127.0.0.1:${CINEMAS_API_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  customer-web:
    build:
      context: .
      target: customer-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${CINEMAS_CUSTOMER_WEB_PORT:-13000}:3000"

  admin-web:
    build:
      context: .
      target: admin-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${CINEMAS_ADMIN_WEB_PORT:-13001}:3000"

  seed:
    build:
      context: .
      target: seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
      AUTH_ADMIN_BOOTSTRAP_TOKEN: ${AUTH_ADMIN_BOOTSTRAP_TOKEN:-local-admin-bootstrap-token}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OMDB_API_BASE_URL: ${OMDB_API_BASE_URL:-https://www.omdbapi.com/}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cinemas.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-local-admin-password-change-me}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-Local Administrator}
    profiles: ["tools"]

volumes:
  cinemas_postgres_data:
