openapi: 3.1.0
info:
  title: Cinemas API
  version: 0.1.0
  description: API contract for the Cinema ticketing backend.
servers:
  - url: http://127.0.0.1:18081
paths:
  /healthz:
    get:
      summary: Check API liveness
      responses:
        '200':
          description: API is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}
  /v1/auth/register:
    post:
      summary: Register a customer
      requestBody: {$ref: '#/components/requestBodies/Register'}
      responses:
        '201': {$ref: '#/components/responses/SessionCreated'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/EmailAlreadyRegistered'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/auth/bootstrap-admin:
    post:
      summary: Bootstrap the one initial administrator
      parameters:
        - name: X-Admin-Bootstrap-Token
          in: header
          required: true
          schema: {type: string}
      requestBody: {$ref: '#/components/requestBodies/Register'}
      responses:
        '201': {$ref: '#/components/responses/SessionCreated'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/AdminAlreadyBootstrapped'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/admin/cinemas:
    get:
      summary: List cinemas configured by an administrator
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Cinemas in deterministic name and ID order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CinemaList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a cinema
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/CinemaWrite'}
      responses:
        '201':
          description: Cinema created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cinema'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/admin/cinemas/{cinemaID}:
    get:
      summary: Get one cinema
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CinemaID'}]
      responses:
        '200':
          description: Cinema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cinema'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CinemaNotFound'}
    patch:
      summary: Replace a cinema's name and location
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CinemaID'}]
      requestBody: {$ref: '#/components/requestBodies/CinemaWrite'}
      responses:
        '200':
          description: Cinema updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cinema'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CinemaNotFound'}
    delete:
      summary: Delete a cinema without dependent studios
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CinemaID'}]
      responses:
        '204': {description: Cinema deleted}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CinemaNotFound'}
  /v1/admin/studios:
    get:
      summary: List studios
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Studios, content: {application/json: {schema: {$ref: '#/components/schemas/StudioList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a studio
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/StudioWrite'}
      responses:
        '201': {description: Studio created, content: {application/json: {schema: {$ref: '#/components/schemas/Studio'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/CinemaNotFound'}
  /v1/admin/studios/{studioID}:
    patch:
      summary: Replace a studio
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/StudioWrite'}
      responses:
        '200': {description: Studio updated, content: {application/json: {schema: {$ref: '#/components/schemas/Studio'}}}}
        '404': {$ref: '#/components/responses/StudioNotFound'}
    delete:
      summary: Delete a studio
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Studio deleted}
        '404': {$ref: '#/components/responses/StudioNotFound'}
  /v1/admin/seats:
    get:
      summary: List physical seats in every configured studio layout
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Seats in deterministic layout order, content: {application/json: {schema: {$ref: '#/components/schemas/SeatLayoutList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Add a physical seat to a studio layout
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/SeatLayoutWrite'}
      responses:
        '201': {description: Seat created, content: {application/json: {schema: {$ref: '#/components/schemas/SeatLayout'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/StudioNotFound'}
        '409': {$ref: '#/components/responses/SeatCreateConflict'}
  /v1/admin/seats/{seatID}:
    patch:
      summary: Replace a physical seat in a studio layout
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SeatID'}]
      requestBody: {$ref: '#/components/requestBodies/SeatLayoutWrite'}
      responses:
        '200': {description: Seat updated, content: {application/json: {schema: {$ref: '#/components/schemas/SeatLayout'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SeatNotFound'}
        '409': {$ref: '#/components/responses/SeatUpdateConflict'}
    delete:
      summary: Delete a physical seat from a studio layout
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SeatID'}]
      responses:
        '204': {description: Seat deleted}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SeatNotFound'}
        '409': {$ref: '#/components/responses/SeatLayoutInUse'}
  /v1/admin/movies:
    get:
      summary: List administrator-managed movies
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Movies in deterministic title and ID order, content: {application/json: {schema: {$ref: '#/components/schemas/AdminMovieList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a movie
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/AdminMovieWrite'}
      responses:
        '201': {description: Movie created, content: {application/json: {schema: {$ref: '#/components/schemas/Movie'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/admin/movies/{movieID}:
    patch:
      summary: Replace a movie
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/MovieID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminMovieWrite'}
      responses:
        '200': {description: Movie updated, content: {application/json: {schema: {$ref: '#/components/schemas/Movie'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/MovieNotFound'}
    delete:
      summary: Delete a movie without dependent showtimes
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/MovieID'}]
      responses:
        '204': {description: Movie deleted}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/MovieNotFound'}
  /v1/admin/showtimes:
    get:
      summary: List administrator-managed showtimes
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Showtimes in deterministic start-time and ID order, content: {application/json: {schema: {$ref: '#/components/schemas/AdminShowtimeList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a showtime and materialize its studio seat inventory
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/AdminShowtimeWrite'}
      responses:
        '201': {description: Showtime created, content: {application/json: {schema: {$ref: '#/components/schemas/AdminShowtime'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ShowtimeReferenceNotFound'}
        '409': {$ref: '#/components/responses/ShowtimeOverlap'}
  /v1/admin/showtimes/{showtimeID}:
    patch:
      summary: Replace a showtime and rematerialize unused seat inventory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ShowtimeID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminShowtimeWrite'}
      responses:
        '200': {description: Showtime updated, content: {application/json: {schema: {$ref: '#/components/schemas/AdminShowtime'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ShowtimeReferenceNotFound'}
        '409': {$ref: '#/components/responses/ShowtimeUpdateConflict'}
    delete:
      summary: Delete a showtime without dependent inventory or orders
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ShowtimeID'}]
      responses:
        '204': {description: Showtime deleted}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ShowtimeNotFound'}
        '409': {$ref: '#/components/responses/ShowtimeInUse'}
  /v1/movies:
    get:
      summary: List public movies
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Movies in deterministic newest-first order
          content:
            application/json:
              schema:
                type: object
                required: [movies]
                properties:
                  movies:
                    type: array
                    items: {$ref: '#/components/schemas/Movie'}
                  next_cursor: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /v1/movies/{movieID}/showtimes:
    get:
      summary: List public showtimes for a movie and UTC date
      parameters:
        - $ref: '#/components/parameters/MovieID'
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Movie showtimes
          content:
            application/json:
              schema:
                type: object
                required: [movie_id, date, showtimes]
                properties:
                  movie_id: {$ref: '#/components/schemas/UUID'}
                  date: {type: string, format: date}
                  showtimes:
                    type: array
                    items: {$ref: '#/components/schemas/Showtime'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/MovieNotFound'}
  /v1/showtimes/{showtimeID}/seats:
    get:
      summary: Get public seat availability for a showtime
      parameters: [{$ref: '#/components/parameters/ShowtimeID'}]
      responses:
        '200':
          description: Seat map without owner or hold details
          content:
            application/json:
              schema:
                type: object
                required: [showtime_id, seats]
                properties:
                  showtime_id: {$ref: '#/components/schemas/UUID'}
                  seats:
                    type: array
                    items: {$ref: '#/components/schemas/Seat'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/ShowtimeNotFound'}
  /v1/orders:
    post:
      summary: Create an idempotent seat hold for the authenticated customer
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showtime_id, seat_ids]
              properties:
                showtime_id: {$ref: '#/components/schemas/UUID'}
                seat_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/UUID'}
      responses:
        '201':
          description: Seats are held pending payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderHold'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/SeatOrIdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/orders/{orderID}/payment-intents:
    post:
      summary: Create an authenticated customer's pending payment intent
      description: The response never changes order state to paid; only a verified provider webhook may do so.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      responses:
        '201':
          description: Pending payment intent created or returned idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentIntent'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/OrderNotFound'}
        '409': {$ref: '#/components/responses/OrderNotPayable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/orders/{orderID}/tickets:
    get:
      summary: List the authenticated customer's paid-order tickets
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      responses:
        '200':
          description: Paid-order tickets, including opaque QR tokens but never token hashes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/OrderNotFound'}
  /v1/webhooks/payments/{provider}:
    post:
      summary: Process a signed payment-provider webhook
      description: Provider-only endpoint. Events are signature-verified, replay-window validated, and deduplicated before any order state changes.
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, enum: [FAKE]}
        - name: X-Payment-Timestamp
          in: header
          required: true
          schema: {type: string, format: date-time}
        - name: X-Payment-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, reference, occurred_at]
              properties:
                id: {type: string}
                type: {type: string, enum: [payment.succeeded, payment.failed, payment.expired]}
                reference: {type: string}
                occurred_at: {type: string, format: date-time}
      responses:
        '204': {description: Event accepted or already processed}
        '401': {description: Invalid signature or expired replay window, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Provider not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    MovieID: {name: movieID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ShowtimeID: {name: showtimeID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    OrderID: {name: orderID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    CinemaID: {name: cinemaID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    SeatID: {name: seatID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, display_name]
            properties:
              email: {type: string, format: email}
              password: {type: string, format: password, minLength: 12}
              display_name: {type: string, minLength: 1, maxLength: 100}
    CinemaWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, address, city]
            properties:
              name: {type: string, minLength: 1}
              address: {type: string, minLength: 1}
              city: {type: string, minLength: 1}
    StudioWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cinema_id, name]
            properties:
              cinema_id: {$ref: '#/components/schemas/UUID'}
              name: {type: string, minLength: 1}
    SeatLayoutWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [studio_id, row_label, seat_number, seat_type]
            properties:
              studio_id: {$ref: '#/components/schemas/UUID'}
              row_label: {type: string, minLength: 1}
              seat_number: {type: string, minLength: 1}
              seat_type: {type: string, minLength: 1}
    AdminMovieWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, duration_minutes]
            properties:
              title: {type: string, minLength: 1}
              duration_minutes: {type: integer, minimum: 1}
              rating: {type: string}
              synopsis: {type: string}
              poster_url: {type: string, format: uri}
              release_date: {type: string, format: date}
    AdminShowtimeWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [movie_id, studio_id, starts_at, ends_at, base_price, currency]
            properties:
              movie_id: {$ref: '#/components/schemas/UUID'}
              studio_id: {$ref: '#/components/schemas/UUID'}
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              base_price: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
              currency: {type: string, pattern: '^[A-Z]{3}$'}
  responses:
    SessionCreated: {description: Account created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    Session: {description: Authenticated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    InvalidRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthenticated: {description: Missing or invalid credential, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Insufficient role, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidCredentials: {description: Incorrect email or password, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    EmailAlreadyRegistered: {description: Duplicate email, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AdminAlreadyBootstrapped: {description: Initial admin exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MovieNotFound: {description: Movie not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ShowtimeNotFound: {description: Showtime not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ShowtimeReferenceNotFound: {description: Showtime, movie, or studio not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ShowtimeInUse: {description: Showtime has dependent inventory or orders, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ShowtimeOverlap: {description: Showtime overlaps another screening in the same studio, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ShowtimeUpdateConflict: {description: Showtime overlaps another screening or has inventory already in use, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    CinemaNotFound: {description: Cinema not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    StudioNotFound: {description: Studio not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatNotFound: {description: Seat not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatAlreadyExists: {description: Seat position already exists in this studio, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatLayoutInUse: {description: A showtime exists for the affected studio, so its seat layout is immutable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatCreateConflict: {description: Seat position already exists or the studio's seat layout is immutable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatUpdateConflict: {description: Seat position already exists or an affected studio's seat layout is immutable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    OrderNotFound: {description: Order not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    OrderNotPayable: {description: Order cannot be paid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SeatOrIdempotencyConflict: {description: Seat unavailable or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: Request limit exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    User:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {type: string, enum: [CUSTOMER, ADMIN]}
    Session:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        user: {$ref: '#/components/schemas/User'}
    Movie:
      type: object
      required: [id, title, duration_minutes]
